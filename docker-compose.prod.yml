# Üretim: veritabanı portu yayımlanmaz. HTTPS için önünde Caddy/Nginx kullanın.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hbb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
      POSTGRES_DB: salon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbb -d salon"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://hbb:${POSTGRES_PASSWORD}@db:5432/salon
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN zorunlu ornek https://salon.ornek.bel.tr}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      SESSION_HOURS: ${SESSION_HOURS:-8}
      UPLOAD_DIR: /app/data/uploads
      CLIENT_DIST: /app/client/dist
      NVI_MODE: ${NVI_MODE:-kps-public}
      NVI_ENDPOINT: ${NVI_ENDPOINT:-https://tckimlik.nvi.gov.tr/Service/KPSPublicV2.asmx}
      NVI_TIMEOUT_MS: ${NVI_TIMEOUT_MS:-8000}
      NVI_USERNAME: ${NVI_USERNAME:-}
      NVI_PASSWORD: ${NVI_PASSWORD:-}
      NVI_STS_URL: ${NVI_STS_URL:-https://kimlikdogrulama.nvi.gov.tr/Services/Issuer.svc/IWSTrust13}
      NVI_KPS_URL: ${NVI_KPS_URL:-https://kpsv2.nvi.gov.tr/Services/RoutingService.svc}
    volumes:
      - uploads:/app/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
